name: Waka Readme

on:
  workflow_dispatch: # for manual workflow trigger
  schedule:
    - cron: "0 17 * * *" # runs at 3AM Sydney time (3AM UTC+10)

jobs:
  update-readme:
    name: WakaReadme DevMetrics
    runs-on: ubuntu-latest
    steps:
      - uses: athul/waka-readme@master
        with:
          # WakaTime requires an OAuth token; WAKATIME_API_KEY remains as a legacy secret name.
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_OAUTH_TOKEN || secrets.WAKATIME_API_KEY }}
